# CrossCode (1.4.2 mobile/PC web assets) on quixjs: vanilla JS + canvas2d.
# The game is Impact/Cubic ("sc.*"), 568x320 at scale 2 = 1136x640.

[engine]
name      = "vanilla"
fps       = 60
nwjs      = true      # the game's DESKTOP path: require('fs') for saves, nw.gui App.dataPath
js_memory = 256
canvas_id = "canvas"

[game]
title     = "CrossCode"
id        = "crosscode"
game_dir  = "gamedata/assets"
cache_dir = "cache/gamedata"
width     = 1136
height    = 640

[scripts]
libs = [
  "impact/page/js/aes.js",
  "impact/page/js/seedrandom.js",
  "ccx-boot.js",
]
includes = []
entry    = "js/game.compiled.js"

[controls]
gamepad = true
