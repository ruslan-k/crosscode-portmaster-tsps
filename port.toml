# CrossCode (1.4.2 mobile/PC web assets) on quixjs: vanilla JS + canvas2d.
# The game is Impact/Cubic ("sc.*"), 568x320 at scale 2 = 1136x640.

[engine]
name      = "vanilla"
fps       = 60
nwjs      = true      # the game's DESKTOP path: require('fs') for saves, nw.gui App.dataPath
js_memory = 256
canvas_id = "canvas"

[game]
title     = "CrossCode"
version   = "1.0.0"   # the port's version: bump it with every port change
id        = "crosscode"
game_dir  = "gamedata/assets"
cache_dir = "cache/gamedata"
# CrossCode boots with IG_GAME_SCALE=1: its actual Canvas2D is 568x320.
# Keep quixjs's initial/default canvas at the same size so it does not
# allocate unnecessary 1136x640 off-screen surfaces before game resize.
width     = 568
height    = 320

[scripts]
libs = [
  "impact/page/js/aes.js",
  "impact/page/js/seedrandom.js",
  "ccx-boot.js",
]
includes = []
entry    = "js/game.compiled.js"

[controls]
gamepad = true
